# Splunk Universal Forwarder - Sample inputs.conf
# Located typically at: %SPLUNK_HOME%\etc\system\local\inputs.conf or inside a dedicated app

[default]
host = DESKTOP-LHM0G2V

# Windows Application Log Monitoring
[WinEventLog://Application]
disabled = 0
index = main
checkpointInterval = 5
current_only = 0

# Windows Security Log Monitoring
[WinEventLog://Security]
disabled = 0
index = main
checkpointInterval = 5
current_only = 0

# Windows System Log Monitoring
[WinEventLog://System]
disabled = 0
index = main
checkpointInterval = 5
current_only = 0
