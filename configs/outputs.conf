# Splunk Universal Forwarder - Sample outputs.conf
# Located typically at: %SPLUNK_HOME%\etc\system\local\outputs.conf

[tcpout]
defaultGroup = default-autolb-group

[tcpout:default-autolb-group]
# Replace <SPLUNK_ENTERPRISE_IP> with your Splunk Enterprise Indexer's IP address
server = 192.168.1.50:9997

[tcpout-server://192.168.1.50:9997]
